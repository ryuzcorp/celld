# Cello: upstream denoland/celld plus our patches, one commit per
# patch (process: https://cello.ryuz.eu/contributing).
#
# PR and `main` CI runs natively on the runners, not in Docker: the old
# per-arch `docker buildx build` of the whole Dockerfile recompiled from
# scratch on every run (BuildKit cache mounts do not survive across GitHub
# runners), in the `release` profile (fat LTO, `codegen-units = 1`), twice
# per arch (build stage, then the test stage compiling all tests again),
# plus clippy on both arches.
#
#   pull_request / `main` push   `lint`: clippy (once) + rustfmt
#                                `test`: full `cargo test --profile ci`
#                                  under the hostile env, on amd64 and arm64
#                                `docker`: amd64 image build, only when
#                                  Docker inputs changed (always on `main`)
#                                `ci-ok`: the single required check; a
#                                  skipped docker job counts as ok
#   `v*` tag push                publish.yml: verify (including that `ci-ok`
#                                  passed on the tag's commit), build and push
#                                  the release image per arch with no test
#                                  stage, then stitch, attest and release
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --profile ci --all-targets --locked -- -D warnings
      - name: rustfmt
        run: cargo fmt --check

  test:
    name: Test (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, suffix: amd64 }
          - { runner: ubuntu-24.04-arm, suffix: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Hostile env, as the Dockerfile test stage had it: a stale CELLD_*
      # (cello refuses to start) and a CELLO_DEV_STATE pointing nowhere
      # writable. A test whose outcome depends on the harness env, or a
      # `cello` spawn that bypasses tests/common's cleared env, fails here
      # instead of on a developer machine.
      CELLD_HERMETIC_CANARY: 1
      CELLO_DEV_STATE: /proc/cello-canary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.98.1
      # The deploy `--sourcemap` tests bundle a fixture through esbuild, like
      # a Worker deploy does. Pinned by version and by the npm tarballs'
      # sha512 (the same pins the Dockerfile test stage carried); installed
      # onto PATH for the test run only.
      - name: Install esbuild
        run: |
          set -euo pipefail
          case "${{ matrix.suffix }}" in
            amd64) pkg=linux-x64
                   sha=e314d9af5154992a105b85c85a68addedcd0ad44d933e3773f45d5f3144e298179d177c8ef178ef74fb56d9bcdc3122e7d0f610d0551247e588603d517c03f1d ;;
            arm64) pkg=linux-arm64
                   sha=a56e000b43f78adf1cedda3d315338a79d45cc7cdd33f4d9adeaeeae045c1c9d964dad55435088ab5f319dc7e9049c38a23922659aca5b6c8805604ff768fa52 ;;
            *) echo "unsupported arch ${{ matrix.suffix }} for esbuild" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/esbuild.tgz \
            "https://registry.npmjs.org/@esbuild/${pkg}/-/${pkg}-0.28.2.tgz"
          echo "${sha}  /tmp/esbuild.tgz" | sha512sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/esbuild.tgz -C /tmp package/bin/esbuild
          install -m 755 /tmp/package/bin/esbuild "$HOME/.local/bin/esbuild"
          rm -rf /tmp/esbuild.tgz /tmp/package
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/esbuild" --version
      # Per-arch key: matrix legs share one job id, so without `key` the
      # amd64 and arm64 legs would poison each other's cache. Only `main`
      # pushes save: PRs read `main`'s warm cache, never write.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.suffix }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --profile ci --locked

  # Which PRs need an image build: only ones touching Docker inputs.
  changes:
    name: Changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a PR's changed files through the PR API.
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/**'

  # The image still has to build: amd64 only, and only when a Docker input
  # changed. Always on `main` pushes, so `main` never rots. Pushes nothing.
  docker:
    name: Build image (amd64)
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build image
        run: |
          set -euo pipefail
          version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version = "/{gsub(/"/,"");print $3;exit}' crates/cello/Cargo.toml)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "CELLO_COMMIT=$GITHUB_SHA" \
            --build-arg "CELLO_VERSION=$version-cello.ci" \
            --label "org.opencontainers.image.source=https://github.com/ryuzcorp/cello" \
            --label "org.opencontainers.image.version=$version-cello.ci" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .

  # The single required check: branch protection requires `ci-ok` instead of
  # the old per-arch job names. A skipped docker job counts as ok.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, changes, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require all jobs
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          CHANGES: ${{ needs.changes.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          fail=0
          [ "$LINT" = "success" ] || { echo "lint is required but was $LINT" >&2; fail=1; }
          [ "$TEST" = "success" ] || { echo "test is required but was $TEST" >&2; fail=1; }
          [ "$CHANGES" = "success" ] || { echo "changes is required but was $CHANGES" >&2; fail=1; }
          case "$DOCKER" in
            success|skipped) ;;
            *) echo "docker is required but was $DOCKER" >&2; fail=1 ;;
          esac
          exit "$fail"
